name: Publish Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, for example 1.1'
        required: true
      version_code:
        description: 'Increasing Android version code (leave empty to derive it from the version)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          TAG_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${INPUT_VERSION:-${TAG_NAME#v}}"
          # Derived from the version (1.7 -> 10700, 1.7.2 -> 10702) so CI and self-hosted builds always agree and increase.
          DERIVED_CODE=$(echo "$VERSION" | awk -F. '{ printf "%d", $1 * 10000 + $2 * 100 + $3 }')
          VERSION_CODE="${INPUT_VERSION_CODE:-$DERIVED_CODE}"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/isrm-release.jks"
      - name: Build signed APK and Play bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:packageReleaseApk :app:exportPlayBundle \
            -PVERSION_NAME="${{ steps.version.outputs.name }}" \
            -PVERSION_CODE="${{ steps.version.outputs.code }}" \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/isrm-release.jks" \
            -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/distribution/IŠRM-${{ steps.version.outputs.name }}.apk
      - name: Upload Play Console bundle
        uses: actions/upload-artifact@v4
        with:
          name: IŠRM-${{ steps.version.outputs.name }}-play-bundle
          path: android/app/build/outputs/distribution/IŠRM-${{ steps.version.outputs.name }}.aab
          if-no-files-found: error
