services:
  timetable:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3000
      DATA_DIR: /data
      TZ: Europe/Ljubljana
      REFRESH_MINUTES: 15
      MIN_REQUEST_INTERVAL_SECONDS: 3
      PRELOAD_WEEKS: ${PRELOAD_WEEKS:-45}
      PRELOAD_REFRESH_MINUTES: 360
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.majmohar.eu}
      NTFY_TOPIC: ${NTFY_TOPIC:-isrm-alerts}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      APP_VERSION: ${APP_VERSION:-1.6}
      ANDROID_APP_VERSION: ${ANDROID_APP_VERSION:-1.0}
      ANDROID_APK_URL: ${ANDROID_APK_URL:-}
      ANDROID_RELEASE_URL: ${ANDROID_RELEASE_URL:-/android}
      ANDROID_RELEASE_NOTES: ${ANDROID_RELEASE_NOTES:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: "true"
    volumes:
      - timetable-cache:/data
      # Signed APKs offered at /downloads/ISRM-<version>.apk.
      - ./releases:/releases:ro

volumes:
  timetable-cache:
